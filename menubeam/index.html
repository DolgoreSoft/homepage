<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menubeam: TV Menu Board</title>
<meta name="description" content="Change your store's TV menu board from your phone. Menus, prices, sold-out and notices update instantly.">
<meta property="og:title" content="메뉴빔 Menubeam">
<meta property="og:description" content="폰으로 바꾸는 TV 메뉴판 · Change your TV menu board from your phone">
<script>
// 휴대폰이면 맞는 스토어로 바로 보낸다 (인스타그램 등 앱 안 브라우저 포함). PC 는 아래 버튼을 보여준다.
(function () {
  var ua = navigator.userAgent || '';
  var play = 'https://play.google.com/store/apps/details?id=com.dolgoresoft.menubeam';
  var ios = 'https://apps.apple.com/app/id6834444857';
  if (/android/i.test(ua)) { location.replace(play); return; }
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) { location.replace(ios); }
})();
</script>
<style>
:root{color-scheme:light dark;--t:#222;--b:#fff7f3;--m:#666;--a:#8d4e32;--o:#ff7a2f}
@media(prefers-color-scheme:dark){:root{--t:#eee;--b:#151312;--m:#aaa;--a:#e0a27f}}
body{margin:0;background:var(--b);color:var(--t);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:auto;padding:56px 16px 64px;text-align:center}
img{width:112px;height:112px;border-radius:26px}
h1{font-size:34px;margin:20px 0 4px;color:var(--o)}p{margin:0 0 28px;color:var(--m)}
a.btn{display:block;margin:12px auto;max-width:320px;padding:15px 20px;border-radius:14px;background:var(--a);color:#fff;text-decoration:none;font-weight:600}
.s{font-size:14px;color:var(--m);margin-top:32px}
</style></head><body><main>
<img src="icon.png" alt="">
<h1 id="t">Menubeam</h1>
<p id="d">Change your store's TV menu board from your phone.</p>
<a class="btn" href="https://apps.apple.com/app/id6834444857">App Store (iPhone)</a>
<a class="btn" href="https://play.google.com/store/apps/details?id=com.dolgoresoft.menubeam">Google Play (Android)</a>
<p class="s" id="s">On the TV, install "Menubeam TV" from Google Play on an Android TV / Google TV device.</p>
</main>
<script>
if ((navigator.language || '').toLowerCase().indexOf('ko') === 0) {
  document.documentElement.lang = 'ko';
  document.title = '메뉴빔: TV 메뉴판 앱';
  document.getElementById('t').textContent = '메뉴빔';
  document.getElementById('d').textContent = '폰으로 바꾸는 TV 메뉴판. 메뉴·가격·품절·공지가 매장 TV에 바로 반영돼요.';
  document.getElementById('s').textContent = 'TV에는 Android TV·Google TV 기기에서 Google Play의 "메뉴빔 TV"를 설치해 주세요.';
}
</script>
</body></html>
